<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CampusDev — Hire Verified Student Developers</title>
<meta name="description" content="CampusDev connects businesses with college-verified student developers for freelance web, app, and AI projects at startup-friendly rates." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

  :root{
    --indigo:#6C5CE7;
    --indigo-600:#5A4BD1;
    --indigo-700:#4B3DB8;
    --violet-tint:#ECE9FB;
    --violet-tint-2:#E2DDFA;
    --ink:#15152E;
    --ink-soft:#3A3A55;
    --muted:#6B6B82;
    --line:#ECECF3;
    --bg:#FFFFFF;
    --footer:#15152E;
    --gold:#F5A623;
    --green:#22C55E;
    --radius:16px;
    --radius-sm:12px;
    --shadow:0 12px 30px rgba(21,21,46,.07);
    --shadow-sm:0 6px 18px rgba(21,21,46,.06);
    --maxw:1160px;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:var(--font);
    color:var(--ink);
    background:var(--bg);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  img,svg{display:block;max-width:100%}
  a{color:inherit;text-decoration:none}
  h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em;color:var(--ink)}
