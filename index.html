<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CampusDev — Hire Verified Student Developers</title>
<meta name="description" content="CampusDev connects businesses with college-verified student developers for freelance web, app, and AI projects at startup-friendly rates." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

  :root{
    --indigo:#6C5CE7;
    --indigo-600:#5A4BD1;
    --indigo-700:#4B3DB8;
    --violet-tint:#ECE9FB;
    --violet-tint-2:#E2DDFA;
    --ink:#15152E;
    --ink-soft:#3A3A55;
    --muted:#6B6B82;
    --line:#ECECF3;
    --bg:#FFFFFF;
    --footer:#15152E;
    --gold:#F5A623;
    --green:#22C55E;
    --radius:16px;
    --radius-sm:12px;
    --shadow:0 12px 30px rgba(21,21,46,.07);
    --shadow-sm:0 6px 18px rgba(21,21,46,.06);
    --maxw:1160px;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:var(--font);
    color:var(--ink);
    background:var(--bg);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  img,svg{display:block;max-width:100%}
  a{color:inherit;text-decoration:none}
  h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em;color:var(--ink)}
  p{margin:0}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
  .section-title{text-align:center;font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800}
  :focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:6px}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-family:inherit;font-size:.95rem;font-weight:600;
    padding:13px 26px;border-radius:999px;border:1.5px solid transparent;
    cursor:pointer;transition:transform .15s ease,box-shadow .2s ease,background .2s ease,color .2s ease;
    white-space:nowrap;
  }
  .btn-primary{background:var(--indigo);color:#fff;box-shadow:0 8px 20px rgba(108,92,231,.30)}
  .btn-primary:hover{background:var(--indigo-600);transform:translateY(-2px)}
  .btn-secondary{background:#fff;color:var(--indigo);border-color:var(--indigo)}
  .btn-secondary:hover{background:var(--violet-tint);transform:translateY(-2px)}
  .btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);padding:9px 18px}
  .btn-ghost:hover{border-color:var(--indigo);color:var(--indigo)}
  .btn-sm{padding:9px 20px;font-size:.9rem}


  .site-header{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.85);
    backdrop-filter:saturate(160%) blur(10px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;
    padding:14px 24px;max-width:var(--maxw);margin:0 auto;
  }
  .brand{display:inline-flex;align-items:center;gap:10px;order:1;font-weight:800;font-size:1.2rem;letter-spacing:-.02em}
  .brand svg{width:30px;height:30px}
