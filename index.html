<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CampusDev — Hire Verified Student Developers</title>
<meta name="description" content="CampusDev connects businesses with college-verified student developers for freelance web, app, and AI projects at startup-friendly rates." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

  :root{
    --indigo:#6C5CE7;
    --indigo-600:#5A4BD1;
    --indigo-700:#4B3DB8;
    --violet-tint:#ECE9FB;
    --violet-tint-2:#E2DDFA;
    --ink:#15152E;
    --ink-soft:#3A3A55;
    --muted:#6B6B82;
    --line:#ECECF3;
    --bg:#FFFFFF;
    --footer:#15152E;
    --gold:#F5A623;
    --green:#22C55E;
    --radius:16px;
    --radius-sm:12px;
    --shadow:0 12px 30px rgba(21,21,46,.07);
    --shadow-sm:0 6px 18px rgba(21,21,46,.06);
    --maxw:1160px;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:var(--font);
    color:var(--ink);
    background:var(--bg);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  img,svg{display:block;max-width:100%}
  a{color:inherit;text-decoration:none}
  h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em;color:var(--ink)}
  p{margin:0}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
  .section-title{text-align:center;font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800}
  :focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:6px}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-family:inherit;font-size:.95rem;font-weight:600;
    padding:13px 26px;border-radius:999px;border:1.5px solid transparent;
    cursor:pointer;transition:transform .15s ease,box-shadow .2s ease,background .2s ease,color .2s ease;
    white-space:nowrap;
  }
  .btn-primary{background:var(--indigo);color:#fff;box-shadow:0 8px 20px rgba(108,92,231,.30)}
  .btn-primary:hover{background:var(--indigo-600);transform:translateY(-2px)}
  .btn-secondary{background:#fff;color:var(--indigo);border-color:var(--indigo)}
  .btn-secondary:hover{background:var(--violet-tint);transform:translateY(-2px)}
  .btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);padding:9px 18px}
  .btn-ghost:hover{border-color:var(--indigo);color:var(--indigo)}
  .btn-sm{padding:9px 20px;font-size:.9rem}


  .site-header{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.85);
    backdrop-filter:saturate(160%) blur(10px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;
    padding:14px 24px;max-width:var(--maxw);margin:0 auto;
  }
  .brand{display:inline-flex;align-items:center;gap:10px;order:1;font-weight:800;font-size:1.2rem;letter-spacing:-.02em}
  .brand svg{width:30px;height:30px}

  .nav-toggle{display:none}                       /* checkbox always hidden */
  .nav-toggle-btn{   
    order:2;margin-left:auto;display:flex;flex-direction:column;gap:5px;
    background:none;border:0;cursor:pointer;padding:8px;
  }
  .nav-toggle-btn span{display:block;width:22px;height:2px;background:var(--ink);border-radius:2px;transition:transform .25s ease,opacity .2s ease}

  .nav-links{order:3;display:none;flex-basis:100%;flex-direction:column;gap:2px;padding:8px 0 12px;border-top:1px solid var(--line)}
  .nav-links a{padding:10px 4px;color:var(--ink-soft);font-weight:500;font-size:.95rem;border-radius:8px}
  .nav-links a:hover{color:var(--indigo)}
  .nav-auth{order:4;display:none;flex-basis:100%;flex-direction:column;gap:10px;padding:4px 0 14px}
  .nav-auth .btn{width:100%}

  .nav-toggle:checked ~ .nav-links{display:flex}
  .nav-toggle:checked ~ .nav-auth{display:flex}
  .nav-toggle:checked ~ .nav-toggle-btn span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .nav-toggle:checked ~ .nav-toggle-btn span:nth-child(2){opacity:0}
  .nav-toggle:checked ~ .nav-toggle-btn span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

  .hero{padding:64px 0 56px}
  .hero-grid{display:grid;grid-template-columns:1fr;gap:40px;align-items:center}
  .hero h1{font-size:clamp(2.2rem,6vw,3.4rem);font-weight:800}
  .hero .subhead{margin-top:18px;color:var(--muted);font-size:1.08rem;max-width:520px}
  .hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
  .hero-art{width:100%;max-width:560px;margin:0 auto}

  .how{padding:72px 0}
  .steps{display:grid;grid-template-columns:1fr;gap:22px;margin-top:42px}
  .step-card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:26px;box-shadow:var(--shadow-sm);transition:transform .2s ease,box-shadow .2s ease;
  }
  .step-head{display:flex;align-items:center;gap:14px}
  .step-icon{flex:0 0 auto;width:52px;height:52px;border-radius:14px;background:var(--violet-tint);display:grid;place-items:center}
  .step-icon svg{width:26px;height:26px}
  .step-card h3{font-size:1.15rem;font-weight:700}
  .step-card p{margin-top:14px;color:var(--muted);font-size:.96rem}

  .trust{background:var(--violet-tint);padding:64px 0;text-align:center}
  .trust h2{font-size:clamp(1.5rem,3vw,2rem);font-weight:800}
  .trust-badge{width:120px;height:132px;margin:26px auto 0}
  .trust-points{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 28px;margin-top:24px}
  .trust-points span{display:inline-flex;align-items:center;gap:8px;color:var(--ink-soft);font-weight:500;font-size:.95rem}
  .trust-points span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--indigo)}

  .testimonials{padding:72px 0}
  .t-grid{display:grid;grid-template-columns:1fr;gap:22px;margin-top:42px}
  .t-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-sm)}
  .t-top{display:flex;align-items:center;gap:14px}
  .avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.95rem;flex:0 0 auto}
  .a1{background:linear-gradient(135deg,#6C5CE7,#9B8CFF)}
  .a2{background:linear-gradient(135deg,#22C55E,#34D399)}
  .a3{background:linear-gradient(135deg,#F5A623,#F97362)}
  .stars{color:var(--gold);letter-spacing:2px;font-size:1rem}
  .t-quote{margin-top:14px;color:var(--ink-soft);font-size:.98rem}
  .t-author{margin-top:16px;font-size:.9rem}
  .t-author strong{color:var(--ink);font-weight:700}
  .t-author span{color:var(--muted)}


  .site-footer{background:var(--footer);color:#A9A9C8;padding:56px 0 28px}
  .footer-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px 24px}
  .footer-brand .brand{color:#fff}
  .footer-brand p{margin-top:14px;max-width:280px;font-size:.92rem;color:#8E8EB0}
  .footer-col h4{color:#fff;font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;margin:0 0 14px}
  .footer-col ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .footer-col a{font-size:.92rem;color:#A9A9C8;transition:color .15s ease}
  .footer-col a:hover{color:#fff}
  .footer-bottom{display:flex;flex-direction:column;gap:18px;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid rgba(255,255,255,.10)}
  .footer-bottom small{color:#8E8EB0;font-size:.85rem}
  .socials{display:flex;gap:12px}
    .socials a{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;transition:background .2s ease,transform .2s ease}
  .socials a:hover{background:var(--indigo);transform:translateY(-2px)}
  .socials svg{width:18px;height:18px;fill:#fff}

  @media (min-width:640px){
    .steps{grid-template-columns:repeat(3,1fr)}
    .t-grid{grid-template-columns:repeat(3,1fr)}
    .footer-grid{grid-template-columns:1.4fr repeat(4,1fr)}
  }

  @media (min-width:860px){
    .header-inner{display:grid;grid-template-columns:auto 1fr auto;flex-wrap:nowrap}
    .nav-toggle-btn{display:none}
    .nav-links{display:flex;flex-basis:auto;flex-direction:row;justify-self:center;gap:30px;padding:0;border:0}
    .nav-links a{padding:6px 0}
    .nav-auth{display:flex;flex-basis:auto;flex-direction:row;justify-self:end;gap:12px;padding:0}
    .nav-auth .btn{width:auto}
    .hero-grid{grid-template-columns:1.05fr .95fr;gap:48px}
    .hero .subhead{margin-left:0}
  }

  @media (max-width:560px){
    .hero-cta{flex-direction:column}
    .hero-cta .btn{width:100%}
    .footer-bottom{flex-direction:column}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <input type="checkbox" id="navToggle" class="nav-toggle" aria-hidden="true" />

      <a class="brand" href="#" aria-label="CampusDev home">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <defs><linearGradient id="logoG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7B6CF0"/><stop offset="1" stop-color="#5A4BD1"/>
          </linearGradient></defs>
          <circle cx="16" cy="16" r="16" fill="url(#logoG)"/>
          <path d="M16 9 L26 13 L16 17 L6 13 Z" fill="#fff"/>
          <path d="M11 15 v4 c0 1.6 10 1.6 10 0 v-4" fill="none" stroke="#fff" stroke-width="1.6"/>
          <line x1="26" y1="13" x2="26" y2="18" stroke="#fff" stroke-width="1.6"/>
        </svg>
